<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Masuk / Daftar — Tour Penjelajah Bali</title>
  <meta name="description" content="Masuk atau buat akun baru untuk memulai petualangan gamifikasi menjelajahi keindahan dan budaya autentik Bali." />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#1A3D2F" />
  <!-- Optimasi Tipografi Clean Non-blocking -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Stylesheet Utama & Offline Fallback -->
  <link rel="stylesheet" href="/src/styles/main.css" />
  <style>
    :root { --bg-krem: #F5EFE0; --text-teks: #2B2B24; }
    html, body { background-color: #F5EFE0; color: #2B2B24; margin: 0; font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; }
  </style>
</head>
<body class="flex flex-col min-h-screen">

  <div id="navbar"></div>

  <main class="flex-1 flex items-center justify-center py-12 px-4 sm:px-6">
    <div class="w-full max-w-md mx-auto">
      
      <!-- Card Form Organik -->
      <div class="card-organik !p-8 animate-fade-in">
        
        <!-- Header -->
        <div class="text-center mb-6">
          <div class="w-16 h-16 rounded-full bg-daun/10 text-daun flex items-center justify-center mx-auto mb-3 shadow-inner" id="auth-logo-badge">
            <span id="auth-header-icon"></span>
          </div>
          <h1 class="font-heading text-2xl sm:text-3xl font-bold text-tanah-gelap" id="form-title">
            Selamat Datang
          </h1>
          <p class="font-body text-sm text-tanah/70 mt-1" id="form-subtitle">
            Masuk untuk melanjutkan petualangan Pulau Dewata Anda
          </p>
        </div>

        <!-- Tab Switch (Masuk vs Daftar) -->
        <div class="flex p-1 bg-pasir/40 rounded-2xl mb-6 border border-pasir/50">
          <button type="button" id="tab-login" class="flex-1 py-2 text-sm font-semibold rounded-xl transition-all duration-200 bg-white text-daun shadow-sm">
            Masuk
          </button>
          <button type="button" id="tab-register" class="flex-1 py-2 text-sm font-semibold rounded-xl transition-all duration-200 text-tanah/70 hover:text-tanah-gelap">
            Daftar Akun
          </button>
        </div>

        <!-- Alert Pesan Error / Sukses -->
        <div id="auth-alert" class="hidden mb-5 p-3.5 rounded-2xl text-sm font-body" role="alert"></div>

        <!-- Form Autentikasi -->
        <form id="auth-form" class="space-y-4" novalidate>
          
          <!-- Field Nama Lengkap (hanya tampil saat Daftar) -->
          <div id="field-name" class="hidden">
            <label class="block font-body text-sm font-medium text-tanah-gelap mb-1.5" for="name">
              Nama Lengkap
            </label>
            <input type="text" id="name" name="name"
              class="w-full px-4 py-3 rounded-2xl border border-pasir bg-white font-body text-teks placeholder-tanah/40 focus:outline-none focus:ring-2 focus:ring-daun/30 focus:border-daun transition-all duration-200"
              placeholder="Contoh: Putu Arya Penjelajah" />
          </div>

          <!-- Field Email -->
          <div>
            <label class="block font-body text-sm font-medium text-tanah-gelap mb-1.5" for="email">
              Alamat Email
            </label>
            <input type="email" id="email" name="email" required
              class="w-full px-4 py-3 rounded-2xl border border-pasir bg-white font-body text-teks placeholder-tanah/40 focus:outline-none focus:ring-2 focus:ring-daun/30 focus:border-daun transition-all duration-200"
              placeholder="nama@email.com" />
          </div>

          <!-- Field Password -->
          <div>
            <label class="block font-body text-sm font-medium text-tanah-gelap mb-1.5" for="password">
              Kata Sandi
            </label>
            <input type="password" id="password" name="password" required minlength="6"
              class="w-full px-4 py-3 rounded-2xl border border-pasir bg-white font-body text-teks placeholder-tanah/40 focus:outline-none focus:ring-2 focus:ring-daun/30 focus:border-daun transition-all duration-200"
              placeholder="Minimal 6 karakter" />
          </div>

          <!-- Tombol Submit -->
          <button type="submit" id="btn-submit" class="btn-primer w-full !py-3.5 mt-2">
            <span id="submit-spinner" class="hidden inline-block animate-spin mr-2">◌</span>
            <span id="submit-text">Masuk Sekarang</span>
          </button>
        </form>

        <!-- Footer Info -->
        <p class="text-center text-xs text-tanah/60 font-body mt-6">
          Dengan masuk, Anda siap menjelajahi kearifan lokal Bali dengan penuh rasa hormat.
        </p>

      </div>
    </div>
  </main>

  <div id="footer"></div>

  <script type="module" src="/src/pages/masuk.js"></script>
</body>
</html>
