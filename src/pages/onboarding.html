<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Preferensi Petualangan — Tour Penjelajah Bali</title>
  <meta name="description" content="Tentukan minat, wilayah favorit, dan anggaran Anda agar AI dapat merekomendasikan petualangan Bali terbaik." />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin />
  <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
  <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
  <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com" />
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;700;800&family=Nunito+Sans:wght@400;600;700;800&display=swap" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;700;800&family=Nunito+Sans:wght@400;600;700;800&display=swap" media="print" onload="this.media='all'" />
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;700;800&family=Nunito+Sans:wght@400;600;700;800&display=swap" /></noscript>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" media="print" onload="this.media='all'" />
  <noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" /></noscript>
</head>
<body class="flex flex-col min-h-screen">

  <div id="navbar"></div>

  <main class="flex-1 py-12 px-4 sm:px-6">
    <div class="max-w-2xl mx-auto">
      
      <!-- Card Onboarding -->
      <div class="card-organik !p-6 sm:!p-10 animate-fade-in">
        
        <div class="text-center mb-8">
          <div class="w-20 h-20 sm:w-24 sm:h-24 rounded-2xl bg-gradient-to-tr from-amber-200 to-daun/20 border-2 border-terakota/30 p-1 flex items-center justify-center mx-auto mb-3 overflow-hidden shadow-md animate-float-bara">
            <img src="/images/mascot-barong.png" alt="Bara Maskot" class="w-full h-full object-contain filter drop-shadow">
          </div>
          <span class="badge-daun mb-2 inline-flex items-center gap-1.5">
            <i class="fa-solid fa-compass text-xs"></i>
            <span>Pemandu Pribadi: Bara si Barong</span>
          </span>
          <h1 class="font-heading text-2xl sm:text-3xl font-bold text-tanah-gelap">
            Rancang Gaya Petualanganmu
          </h1>
          <p class="font-body text-xs sm:text-sm text-tanah/75 mt-1.5 max-w-md mx-auto leading-relaxed">
            Bantu Bara mengenali minatmu agar kami bisa merekomendasikan formula 3 surga tersembunyi + 1 kuliner legendaris yang paling cocok untukmu!
          </p>
        </div>

        <form id="onboarding-form" class="space-y-8">

          <!-- 1. PILIH MINAT -->
          <div>
            <div class="flex items-center justify-between mb-3">
              <label class="font-heading text-lg font-semibold text-tanah-gelap">
                1. Minat Petualangan
              </label>
              <span class="text-xs text-tanah/60 font-body">Pilih minimal 1</span>
            </div>
            <div class="grid grid-cols-2 sm:grid-cols-3 gap-3" id="interests-container">
              <!-- Rendered via JS -->
            </div>
          </div>

          <!-- 2. WILAYAH FAVORIT -->
          <div>
            <div class="flex items-center justify-between mb-3">
              <label class="font-heading text-lg font-semibold text-tanah-gelap">
                2. Wilayah yang Ingin Dijelajahi
              </label>
              <span class="text-xs text-tanah/60 font-body">Boleh pilih banyak</span>
            </div>
            
            <!-- Opsi Kejutkan Saya -->
            <div class="mb-3">
              <button type="button" id="btn-surprise"
                class="w-full flex items-center justify-center gap-2 p-3 rounded-2xl border-2 border-dashed border-padi bg-padi/10 text-tanah-gelap font-body font-semibold text-sm transition-all hover:bg-padi/20">
                <i class="fa-solid fa-wand-magic-sparkles text-padi-dark"></i>
                <span>Kejutkan Saya (Rekomendasikan Seluruh Penjuru Bali)</span>
              </button>
            </div>

            <div class="grid grid-cols-2 sm:grid-cols-3 gap-2.5" id="regions-container">
              <!-- Rendered via JS -->
            </div>
          </div>

          <!-- 3. PILIHAN ANGGARAN -->
          <div>
            <label class="block font-heading text-lg font-semibold text-tanah-gelap mb-3">
              3. Preferensi Anggaran (Budget)
            </label>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3" id="budget-container">
              <!-- Rendered via JS -->
            </div>
          </div>

          <!-- SUBMIT BUTTON -->
          <div class="pt-4 border-t border-pasir/40">
            <button type="submit" id="btn-save-preferences" class="btn-primer w-full !py-4 text-base">
              <span id="save-spinner" class="hidden inline-block animate-spin mr-2">◌</span>
              <span>Simpan & Buat Petualangan Pertama</span>
            </button>
          </div>

        </form>

      </div>
    </div>
  </main>

  <div id="footer"></div>

  <script type="module" src="/src/pages/onboarding.js"></script>
</body>
</html>
