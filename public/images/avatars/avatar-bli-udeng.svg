<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF9" />
      <stop offset="100%" stop-color="#EFE8D8" />
    </linearGradient>
    <linearGradient id="skin-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFDFC4" />
      <stop offset="100%" stop-color="#F5CBA7" />
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>

  <!-- Background Circle -->
  <circle cx="64" cy="64" r="62" fill="url(#bg-grad-1)" stroke="#2E7D32" stroke-width="3"/>
  <circle cx="64" cy="64" r="58" fill="none" stroke="#C8B89A" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- Body / Baju Safari Putih Adat Bali -->
  <path d="M26 120 C28 98 42 86 64 86 C86 86 100 98 102 120 Z" fill="#FFFFFF" stroke="#4A3B32" stroke-width="2.5"/>
  <!-- Kerah Safari & Kancing Emas -->
  <path d="M54 86 L64 98 L74 86" fill="none" stroke="#4A3B32" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="64" cy="104" r="2" fill="url(#gold-grad)"/>
  <circle cx="64" cy="112" r="2" fill="url(#gold-grad)"/>
  <!-- Selendang Tipis Terakota -->
  <path d="M44 94 C54 100 74 100 84 94" fill="none" stroke="#C05621" stroke-width="3" stroke-linecap="round"/>

  <!-- Leher -->
  <rect x="56" y="74" width="16" height="16" rx="4" fill="#F5CBA7"/>

  <!-- Kepala / Wajah Kartun -->
  <ellipse cx="64" cy="60" rx="26" ry="25" fill="url(#skin-grad)" stroke="#4A3B32" stroke-width="2.5"/>

  <!-- Telinga -->
  <circle cx="38" cy="61" r="6" fill="#F5CBA7" stroke="#4A3B32" stroke-width="2"/>
  <circle cx="90" cy="61" r="6" fill="#F5CBA7" stroke="#4A3B32" stroke-width="2"/>

  <!-- Bunga Kamboja / Jepun di Telinga Kanan (Khas Bali) -->
  <g transform="translate(87, 53)">
    <circle cx="0" cy="0" r="3.5" fill="#FBBF24"/>
    <ellipse cx="0" cy="-5" rx="3" ry="4" fill="#FFFFFF"/>
    <ellipse cx="5" cy="-2" rx="3" ry="4" fill="#FFFFFF" transform="rotate(45, 5, -2)"/>
    <ellipse cx="3" cy="4" rx="3" ry="4" fill="#FFFFFF" transform="rotate(110, 3, 4)"/>
    <ellipse cx="-4" cy="3" rx="3" ry="4" fill="#FFFFFF" transform="rotate(180, -4, 3)"/>
    <ellipse cx="-4" cy="-3" rx="3" ry="4" fill="#FFFFFF" transform="rotate(240, -4, -3)"/>
    <circle cx="0" cy="0" r="2" fill="#F59E0B"/>
  </g>

  <!-- Rambut Bawah Udeng -->
  <path d="M40 50 C44 46 50 48 56 46" stroke="#2B1810" stroke-width="3" stroke-linecap="round"/>
  <path d="M88 50 C84 46 78 48 72 46" stroke="#2B1810" stroke-width="3" stroke-linecap="round"/>

  <!-- Udeng Bali Putih (Iket Kepala Tradisional) -->
  <!-- Pita dasar melingkar -->
  <path d="M37 50 C48 42 80 42 91 50 C93 54 88 56 64 54 C40 56 35 54 37 50 Z" fill="#FFFFFF" stroke="#4A3B32" stroke-width="2.5"/>
  <path d="M40 48 C52 44 76 44 88 48" fill="none" stroke="#D97706" stroke-width="2"/>
  <!-- Lipatan puncak udeng (Jenggar) menghadap ke atas -->
  <path d="M58 43 C56 30 63 22 64 20 C66 23 72 32 70 43 Z" fill="#FFFFFF" stroke="#4A3B32" stroke-width="2.5"/>
  <path d="M64 22 L64 43" stroke="#D97706" stroke-width="1.8"/>
  <!-- Hiasan simpul depan -->
  <ellipse cx="64" cy="48" rx="4" ry="3" fill="url(#gold-grad)" stroke="#4A3B32" stroke-width="1.5"/>

  <!-- Alis Kartun Ramah -->
  <path d="M48 54 Q53 50 58 53" fill="none" stroke="#3B2314" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M70 53 Q75 50 80 54" fill="none" stroke="#3B2314" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Mata Berbinar -->
  <circle cx="53" cy="60" r="3.8" fill="#2B1810"/>
  <circle cx="54.2" cy="58.8" r="1.3" fill="#FFFFFF"/>
  <circle cx="75" cy="60" r="3.8" fill="#2B1810"/>
  <circle cx="76.2" cy="58.8" r="1.3" fill="#FFFFFF"/>

  <!-- Pipi Merona (Blush) -->
  <ellipse cx="46" cy="66" rx="4" ry="2.2" fill="#F87171" opacity="0.45"/>
  <ellipse cx="82" cy="66" rx="4" ry="2.2" fill="#F87171" opacity="0.45"/>

  <!-- Hidung Mungil -->
  <path d="M63 62 Q64 64 65 62" fill="none" stroke="#B45309" stroke-width="2" stroke-linecap="round"/>

  <!-- Senyum Ceria -->
  <path d="M57 68 Q64 76 71 68" fill="none" stroke="#4A3B32" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M59 69 Q64 74 69 69" fill="#EF4444" opacity="0.3"/>
</svg>
