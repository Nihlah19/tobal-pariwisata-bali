<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF5" />
      <stop offset="100%" stop-color="#FCE7F3" />
    </linearGradient>
    <linearGradient id="skin-gek" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE4D6" />
      <stop offset="100%" stop-color="#F7D0BA" />
    </linearGradient>
    <linearGradient id="kebaya-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="senteng-pink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#BE185D" />
    </linearGradient>
  </defs>

  <!-- Background Circle -->
  <circle cx="64" cy="64" r="62" fill="url(#bg-grad-2)" stroke="#C05621" stroke-width="3"/>
  <circle cx="64" cy="64" r="58" fill="none" stroke="#F472B6" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- Sanggul Rambut Belakang -->
  <circle cx="64" cy="48" r="32" fill="#201511"/>
  <ellipse cx="64" cy="32" rx="16" ry="12" fill="#201511"/>

  <!-- Bunga Kamboja Jepun di Sanggul Atas -->
  <g transform="translate(64, 23)">
    <circle cx="0" cy="0" r="3" fill="#FBBF24"/>
    <ellipse cx="0" cy="-4" rx="2.5" ry="3.5" fill="#FFFFFF"/>
    <ellipse cx="4" cy="-1.5" rx="2.5" ry="3.5" fill="#FFFFFF" transform="rotate(50, 4, -1.5)"/>
    <ellipse cx="2.5" cy="3" rx="2.5" ry="3.5" fill="#FFFFFF" transform="rotate(120, 2.5, 3)"/>
    <ellipse cx="-3" cy="2.5" rx="2.5" ry="3.5" fill="#FFFFFF" transform="rotate(190, -3, 2.5)"/>
    <ellipse cx="-3.5" cy="-2" rx="2.5" ry="3.5" fill="#FFFFFF" transform="rotate(260, -3.5, -2)"/>
  </g>

  <!-- Body / Kebaya Kuning Bali -->
  <path d="M28 120 C30 96 44 86 64 86 C84 86 98 96 100 120 Z" fill="url(#kebaya-gold)" stroke="#4A3B32" stroke-width="2.5"/>
  <!-- Bukaan Dada Kebaya berenda & Kerah V -->
  <path d="M54 86 L64 100 L74 86" fill="#FCE7F3" stroke="#4A3B32" stroke-width="2"/>
  <path d="M54 86 C58 92 62 98 64 100 C66 98 70 92 74 86" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="2 2" fill="none"/>

  <!-- Senteng / Selendang Ikat Bali Warna Magenta -->
  <path d="M38 106 C50 102 78 102 90 106 L92 118 C80 114 48 114 36 118 Z" fill="url(#senteng-pink)" stroke="#4A3B32" stroke-width="2"/>
  <!-- Bros Emas di Dada -->
  <circle cx="64" cy="111" r="4.5" fill="#FEF08A" stroke="#B45309" stroke-width="1.5"/>
  <circle cx="64" cy="111" r="2" fill="#DC2626"/>

  <!-- Leher -->
  <rect x="56" y="72" width="16" height="16" rx="4" fill="#F7D0BA"/>

  <!-- Kepala / Wajah Kartun -->
  <ellipse cx="64" cy="59" rx="25" ry="24" fill="url(#skin-gek)" stroke="#4A3B32" stroke-width="2.5"/>

  <!-- Rambut Depan Berponi Rapi Tradisional -->
  <path d="M39 52 C45 38 83 38 89 52 C81 44 47 44 39 52 Z" fill="#201511"/>
  <path d="M39 52 C40 58 41 64 42 66 C42 60 46 54 50 51" fill="#201511"/>
  <path d="M89 52 C88 58 87 64 86 66 C86 60 82 54 78 51" fill="#201511"/>

  <!-- Telinga & Anting Subeng Emas Khas Bali -->
  <circle cx="39" cy="62" r="5" fill="#F7D0BA" stroke="#4A3B32" stroke-width="1.8"/>
  <circle cx="37" cy="65" r="3.2" fill="#FBBF24" stroke="#92400E" stroke-width="1.2"/>
  <circle cx="89" cy="62" r="5" fill="#F7D0BA" stroke="#4A3B32" stroke-width="1.8"/>
  <circle cx="91" cy="65" r="3.2" fill="#FBBF24" stroke="#92400E" stroke-width="1.2"/>

  <!-- Bunga Kamboja Kuning Segar di Telinga Kiri -->
  <g transform="translate(37, 52)">
    <circle cx="0" cy="0" r="3.5" fill="#FBBF24"/>
    <ellipse cx="0" cy="-5" rx="3" ry="4" fill="#FFFFFF"/>
    <ellipse cx="5" cy="-2" rx="3" ry="4" fill="#FFFFFF" transform="rotate(45, 5, -2)"/>
    <ellipse cx="3" cy="4" rx="3" ry="4" fill="#FFFFFF" transform="rotate(110, 3, 4)"/>
    <ellipse cx="-4" cy="3" rx="3" ry="4" fill="#FFFFFF" transform="rotate(180, -4, 3)"/>
    <ellipse cx="-4" cy="-3" rx="3" ry="4" fill="#FFFFFF" transform="rotate(240, -4, -3)"/>
    <circle cx="0" cy="0" r="1.8" fill="#F59E0B"/>
  </g>

  <!-- Alis Melengkung Cantik -->
  <path d="M49 53 Q54 49 58 52" fill="none" stroke="#201511" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M70 52 Q74 49 79 53" fill="none" stroke="#201511" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Bulu Mata & Mata Berbinar -->
  <path d="M48 57 L46 55" stroke="#201511" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="53" cy="59" r="4" fill="#201511"/>
  <circle cx="54.2" cy="57.5" r="1.5" fill="#FFFFFF"/>
  <circle cx="51.8" cy="60.5" r="0.8" fill="#FFFFFF"/>

  <path d="M80 57 L82 55" stroke="#201511" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="75" cy="59" r="4" fill="#201511"/>
  <circle cx="76.2" cy="57.5" r="1.5" fill="#FFFFFF"/>
  <circle cx="73.8" cy="60.5" r="0.8" fill="#FFFFFF"/>

  <!-- Pipi Merona Merah Muda Cantik -->
  <ellipse cx="46" cy="66" rx="4.5" ry="2.5" fill="#F43F5E" opacity="0.4"/>
  <ellipse cx="82" cy="66" rx="4.5" ry="2.5" fill="#F43F5E" opacity="0.4"/>

  <!-- Hidung Mungil Halus -->
  <path d="M63 61 Q64 63 65 61" fill="none" stroke="#B45309" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Senyum Manis -->
  <path d="M58 68 Q64 75 70 68" fill="none" stroke="#4A3B32" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M59.5 69 Q64 73 68.5 69" fill="#EC4899" opacity="0.4"/>
</svg>
