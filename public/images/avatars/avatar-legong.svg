<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="100%" stop-color="#FEF3C7" />
    </linearGradient>
    <linearGradient id="skin-legong" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE7D6" />
      <stop offset="100%" stop-color="#F7D3BC" />
    </linearGradient>
    <linearGradient id="gelungan-gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="prada-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#991B1B" />
      <stop offset="100%" stop-color="#7F1D1D" />
    </linearGradient>
  </defs>

  <!-- Background Circle -->
  <circle cx="64" cy="64" r="62" fill="url(#bg-grad-3)" stroke="#D97706" stroke-width="3"/>
  <circle cx="64" cy="64" r="58" fill="none" stroke="#F59E0B" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- Body / Kostum Prada Penari Bali Marun Emas -->
  <path d="M26 120 C28 98 42 88 64 88 C86 88 100 98 102 120 Z" fill="url(#prada-red)" stroke="#4A3B32" stroke-width="2.5"/>
  <!-- Badong (Kerah Hiasan Emas Melingkar Dada) -->
  <path d="M42 88 C48 104 80 104 86 88 C76 96 52 96 42 88 Z" fill="url(#gelungan-gold)" stroke="#78350F" stroke-width="1.8"/>
  <circle cx="64" cy="98" r="2.5" fill="#EF4444" stroke="#78350F" stroke-width="1"/>

  <!-- Leher -->
  <rect x="56" y="74" width="16" height="16" rx="4" fill="#F7D3BC"/>

  <!-- Gelungan Penari Legong (Mahkota Emas Megah) Bagian Belakang -->
  <!-- Sayap mahkota kiri & kanan -->
  <path d="M30 46 C24 34 32 20 44 26 C40 34 38 42 30 46 Z" fill="url(#gelungan-gold)" stroke="#78350F" stroke-width="1.8"/>
  <path d="M98 46 C104 34 96 20 84 26 C88 34 90 42 98 46 Z" fill="url(#gelungan-gold)" stroke="#78350F" stroke-width="1.8"/>
  <!-- Puncak mahkota tengah -->
  <path d="M52 26 C56 12 64 8 64 8 C64 8 72 12 76 26 Z" fill="url(#gelungan-gold)" stroke="#78350F" stroke-width="1.8"/>
  <circle cx="64" cy="12" r="3" fill="#DC2626"/>

  <!-- Ronce Bunga Kamboja & Jepun di Mahkota -->
  <circle cx="48" cy="22" r="3.2" fill="#FFFFFF" stroke="#D97706" stroke-width="1"/>
  <circle cx="48" cy="22" r="1.5" fill="#FBBF24"/>
  <circle cx="80" cy="22" r="3.2" fill="#FFFFFF" stroke="#D97706" stroke-width="1"/>
  <circle cx="80" cy="22" r="1.5" fill="#FBBF24"/>
  <circle cx="36" cy="30" r="3" fill="#FFFFFF" stroke="#D97706" stroke-width="1"/>
  <circle cx="36" cy="30" r="1.3" fill="#FBBF24"/>
  <circle cx="92" cy="30" r="3" fill="#FFFFFF" stroke="#D97706" stroke-width="1"/>
  <circle cx="92" cy="30" r="1.3" fill="#FBBF24"/>

  <!-- Kepala / Wajah Kartun -->
  <ellipse cx="64" cy="62" rx="25" ry="24" fill="url(#skin-legong)" stroke="#4A3B32" stroke-width="2.5"/>

  <!-- Hiasan Dahi Mahkota Bawah (Cunduk) -->
  <path d="M39 52 C50 44 78 44 89 52 C82 48 46 48 39 52 Z" fill="url(#gelungan-gold)" stroke="#78350F" stroke-width="2"/>
  <circle cx="64" cy="49" r="2.5" fill="#DC2626"/>

  <!-- Subeng Emas di Telinga -->
  <circle cx="38" cy="64" r="5" fill="#F7D3BC" stroke="#4A3B32" stroke-width="1.5"/>
  <circle cx="36" cy="66" r="3.8" fill="url(#gelungan-gold)" stroke="#78350F" stroke-width="1.2"/>
  <circle cx="90" cy="64" r="5" fill="#F7D3BC" stroke="#4A3B32" stroke-width="1.5"/>
  <circle cx="92" cy="66" r="3.8" fill="url(#gelungan-gold)" stroke="#78350F" stroke-width="1.2"/>

  <!-- Riasan Titik Putih di Kening (Bindi / Cunduk Ratna Khas Tari Bali) -->
  <circle cx="64" cy="55" r="1.5" fill="#FFFFFF" stroke="#D97706" stroke-width="0.8"/>

  <!-- Alis Melengkung Dramatis Khas Penari Bali -->
  <path d="M48 56 Q54 51 59 55" fill="none" stroke="#2B1810" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M69 55 Q74 51 80 56" fill="none" stroke="#2B1810" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Riasan Mata (Sledet) Penari Bali yang Indah & Bersinar -->
  <path d="M47 60 Q53 57 59 62" stroke="#2B1810" stroke-width="1.8" fill="none"/>
  <circle cx="53" cy="62" r="3.8" fill="#2B1810"/>
  <circle cx="54.2" cy="60.5" r="1.4" fill="#FFFFFF"/>
  <circle cx="51.8" cy="63.2" r="0.7" fill="#FFFFFF"/>

  <path d="M69 62 Q75 57 81 60" stroke="#2B1810" stroke-width="1.8" fill="none"/>
  <circle cx="75" cy="62" r="3.8" fill="#2B1810"/>
  <circle cx="76.2" cy="60.5" r="1.4" fill="#FFFFFF"/>
  <circle cx="73.8" cy="63.2" r="0.7" fill="#FFFFFF"/>

  <!-- Pipi Merona -->
  <ellipse cx="46" cy="68" rx="4.2" ry="2.2" fill="#F87171" opacity="0.45"/>
  <ellipse cx="82" cy="68" rx="4.2" ry="2.2" fill="#F87171" opacity="0.45"/>

  <!-- Hidung Halus -->
  <path d="M63 64 Q64 66 65 64" fill="none" stroke="#B45309" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Senyum Elegan Khas Tari Legong -->
  <path d="M57 71 Q64 77 71 71" fill="none" stroke="#4A3B32" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M58.5 72 Q64 75 69.5 72" fill="#DC2626" opacity="0.5"/>
</svg>
